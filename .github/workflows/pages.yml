name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/build-apt-repo.sh
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy one self-use repository at a time from the latest successful release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: Download latest release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/release-assets
          gh release download --dir build/release-assets --pattern '*.deb' --pattern SHA256SUMS --clobber
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build Pages site and APT repository
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -R docs/. build/pages/
          scripts/build-apt-repo.sh build/release-assets build/pages "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
